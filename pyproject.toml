[project]
name = "sentisis"
version = "0.1.0"
description = "Three-class sentiment analysis API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "redis>=5.2",
    "emoji>=2.14",
    "numpy>=1.26",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "scikit-learn>=1.7",
    "joblib>=1.4",
    "onnx>=1.17",
    "mlflow>=2.17",
    "shap>=0.46",
    "optimum-onnx[onnxruntime]>=0.1",
    "skl2onnx>=1.20",
    "huggingface-hub>=0.26",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"model/notebooks/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*", "emoji.*", "redis.*", "prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs a running service or container"]
