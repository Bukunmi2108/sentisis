services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENTISIS_REDIS_URL: redis://redis:6379/0
      SENTISIS_LOG_LEVEL: INFO
      SENTISIS_ONNX_THREADS: "2"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
